  :root {
    --azul: #07293D; --asfalto: #13242E; --espuma: #EAF6FF; --farol: #FFB43A; --perigo: #E5484D;
    --hair: rgba(234,246,255,.22); --panel: rgba(19,36,46,.93);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--azul); }
  body { font-family: "Saira", system-ui, sans-serif; color: var(--espuma); }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hidden { display: none !important; }
  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #stats { position: absolute; top: 14px; right: 16px; text-align: right; }
  #clock { font-family: "Saira Condensed"; font-weight: 700; font-size: 30px; line-height: 1; }
  #cash { font-size: 24px; font-weight: 600; margin-top: 2px; }
  #debt { font-size: 15px; color: var(--farol); }
  #healthWrap { width: 150px; height: 10px; border: 1px solid var(--hair); margin: 6px 0 4px auto; background: rgba(7,41,61,.6); }
  #healthFill { height: 100%; background: var(--espuma); width: 100%; }
  #healthFill.low { background: var(--perigo); }
  #stars { font-size: 21px; letter-spacing: 2px; color: rgba(234,246,255,.25); }
  #stars .on { color: var(--farol); }
  #stars.flash .on { animation: starflash .6s steps(1) infinite; }
  @keyframes starflash { 50% { color: var(--espuma); } }
  #weaponBox { font-size: 14px; margin-top: 2px; }
  #objective { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); max-width: 70vw; text-align: center; }
  #objLabel { font-size: 13px; opacity: .75; }
  #objText { font-size: 19px; font-weight: 600; color: var(--farol); }
  #toasts { position: absolute; top: 14px; left: 16px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
  .toast { background: var(--panel); border-left: 2px solid var(--farol); padding: 4px 10px; }
  #radarWrap { position: absolute; left: 16px; bottom: 16px; border: 1px solid var(--hair); border-radius: 50%; padding: 3px; }
  #bustWrap { position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%); width: 300px; text-align: center; }
  #bustLabel { font-family: "Saira Condensed"; font-weight: 700; font-size: 19px; color: var(--perigo); }
  #bustBar { height: 9px; border: 1px solid var(--hair); background: rgba(7,41,61,.6); }
  #bustFill { height: 100%; width: 0%; background: var(--perigo); }
  #speedo { position: absolute; right: 18px; bottom: 16px; font-family: "Saira Condensed"; font-weight: 700; font-size: 34px; }
  #speedo small { font-size: 15px; font-weight: 400; }
  #zoneName { position: absolute; right: 18px; bottom: 64px; font-family: "Saira Condensed"; font-weight: 700; font-size: 32px; opacity: 0; transition: opacity .5s; text-align: right; }
  #combo { position: absolute; right: 18px; bottom: 120px; text-align: right; font-size: 17px; }
  #comboMult { font-family: "Saira Condensed"; font-weight: 800; font-size: 30px; color: var(--farol); }
  #prompt { position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%); font-size: 17px; background: var(--panel); padding: 5px 14px; border: 1px solid var(--hair); }
  #subtitle { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); width: min(620px, 72vw); text-align: center; font-size: 19px; text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.6); }
  #subtitle b { color: var(--farol); font-weight: 600; }
  #centerMsg { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-family: "Saira Condensed"; font-weight: 800; font-size: 46px; text-align: center; text-shadow: 0 2px 6px #000; }
  /* Panels */
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--hair); pointer-events: auto; }
  #phone { right: 24px; top: 50%; transform: translateY(-50%); width: 348px; max-height: 78vh; display: flex; flex-direction: column; }
  #phoneTitle { font-family: "Saira Condensed"; font-weight: 700; font-size: 24px; padding: 12px 16px 4px; }
  #phoneTabs { display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 4px 16px 8px; border-bottom: 1px solid var(--hair); font-size: 14px; }
  #phoneTabs span { opacity: .55; cursor: pointer; }
  #phoneTabs span.sel { opacity: 1; color: var(--farol); }
  #phoneBody { padding: 8px 16px 14px; overflow-y: auto; font-size: 15px; line-height: 1.45; }
  #phoneBody .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px solid rgba(234,246,255,.09); }
  #phoneBody .dim { opacity: .6; }
  #phoneBody .msg { padding: 5px 0; border-bottom: 1px solid rgba(234,246,255,.09); }
  #phoneBody .msg b { color: var(--farol); font-weight: 600; }
  #jobcard { left: 50%; top: 46%; transform: translate(-50%, -50%); width: 430px; padding: 20px 24px; }
  #jcTitle { font-family: "Saira Condensed"; font-weight: 800; font-size: 34px; }
  #jcText { font-size: 17px; margin: 6px 0; }
  #jcPay { color: var(--farol); font-size: 19px; font-weight: 600; }
  #jcHint { margin-top: 12px; font-size: 15px; opacity: .8; }
  #help, #modmenu { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 400px; padding: 18px 24px; }
  #help h2, #modmenu h2 { font-family: "Saira Condensed"; font-weight: 700; font-size: 26px; margin: 0 0 8px; }
  .ctl { display: flex; justify-content: space-between; padding: 2.5px 0; border-bottom: 1px solid rgba(234,246,255,.09); font-size: 15px; }
  .ctl b { font-weight: 600; color: var(--farol); }
  #modList .row { display: flex; justify-content: space-between; padding: 5px 4px; font-size: 16px; }
  #modList .row.sel { background: rgba(255,180,58,.16); }
  #wheel { left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 10px; background: none; border: none; }
  .slot { background: var(--panel); border: 1px solid var(--hair); padding: 12px 16px; text-align: center; min-width: 110px; }
  .slot.sel { border-color: var(--farol); color: var(--farol); }
  .slot .ammo { font-size: 14px; opacity: .8; }
  /* Slams, chapter, fade */
  #slam { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
  #slamWord { font-family: "Saira Condensed"; font-weight: 800; font-size: 110px; line-height: .95; animation: slamIn 1.1s cubic-bezier(.2,.8,.2,1) both; text-shadow: 0 3px 0 rgba(0,0,0,.55); }
  #slamWord.wasted { color: var(--perigo); } #slamWord.busted { color: #7aa5e8; } #slamWord.passed { color: var(--farol); }
  #slamLine { font-size: 24px; margin-top: 6px; animation: slamIn 1.2s .3s both; }
  @keyframes slamIn { 0% { opacity: 0; transform: scale(2.1); } 35% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
  #chapter { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(7,41,61,.55); pointer-events: none; text-align: center; }
  #chapterTitle { font-family: "Saira Condensed"; font-weight: 800; font-size: 54px; color: var(--farol); }
  #chapterText { font-size: 19px; margin-top: 6px; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .7s; }
  #fade.on { opacity: 1; }
  /* Title */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
  #titleName { font-family: "Saira Condensed"; font-weight: 800; font-size: 84px; line-height: .95; text-align: center; position: relative; text-shadow: 0 3px 10px rgba(0,0,0,.5); }
  #titleName .glow { position: relative; }
  #titleName .glow::before { content: ""; position: absolute; inset: -38% -22%; background: radial-gradient(ellipse at center, rgba(255,180,58,.5), transparent 65%); z-index: -1; animation: breathe 3.2s ease-in-out 1; }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  #titleSub { font-size: 19px; margin-top: 10px; text-shadow: 0 1px 4px #000; }
  #titleBtns { display: flex; gap: 12px; margin-top: 26px; }
  .tbtn { background: var(--panel); border: 1px solid var(--hair); color: var(--espuma); font-family: "Saira"; font-size: 18px; padding: 9px 26px; cursor: pointer; }
  .tbtn:hover, .tbtn.sel { border-color: var(--farol); color: var(--farol); }
  #titleControls { margin-top: 26px; background: var(--panel); border: 1px solid var(--hair); padding: 12px 22px; width: 620px; column-count: 2; column-gap: 34px; }
  #titleControls .ctl { break-inside: avoid; }
  #photoUi { position: fixed; inset: 18px; border: 1px solid rgba(234,246,255,.4); pointer-events: none; }
  #photoUi span { position: absolute; left: 12px; bottom: 8px; font-size: 15px; text-shadow: 0 1px 3px #000; }
</style>
</head>

<div id="app"></div>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud" class="hidden">
  <div id="objective" class="hidden"><div id="objLabel"></div><div id="objText"></div></div>
  <div id="toasts"></div>
  <div id="stats">
    <div id="clock">17:24</div>
    <div id="cash">$0</div>
    <div id="debt"></div>
    <div id="healthWrap"><div id="healthFill"></div></div>
    <div id="stars"></div>
    <div id="weaponBox"></div>
  </div>
  <div id="radarWrap"><canvas id="radar" width="190" height="190"></canvas></div>
  <div id="combo" class="hidden"><div id="comboMult">x1</div><div id="comboScore"></div></div>
  <div id="bustWrap" class="hidden"><div id="bustLabel">Busted</div><div id="bustBar"><div id="bustFill"></div></div></div>
  <div id="zoneName"></div>
  <div id="speedo" class="hidden">0 <small>km/h</small></div>
  <div id="prompt" class="hidden"></div>
  <div id="subtitle" class="hidden"></div>
  <div id="centerMsg" class="hidden"></div>
</div>
<div id="phone" class="panel hidden">
  <div id="phoneTitle">Phone</div>
  <div id="phoneTabs"></div>
  <div id="phoneBody"></div>
</div>
<div id="jobcard" class="panel hidden">
  <div id="jcTitle"></div><div id="jcText"></div><div id="jcPay"></div>
  <div id="jcHint">Press Enter — Start job. Esc — Not now.</div>
</div>
<div id="help" class="panel hidden"><h2>Controls</h2><div id="helpList"></div></div>
<div id="modmenu" class="panel hidden"><h2>Torque mod shop</h2><div id="modList"></div><div class="ctl"><span>Up / down, Enter buys</span><b>M — Close</b></div></div>
<div id="wheel" class="hidden"></div>
<div id="photoUi" class="hidden"><span>Photo mode — WASD move, mouse drag looks, F takes the photo, P leaves</span></div>
<div id="chapter" class="hidden"><div><div id="chapterTitle"></div><div id="chapterText"></div></div></div>
<div id="slam" class="hidden"><div><div id="slamWord"></div><div id="slamLine"></div></div></div>
<div id="title" class="hidden">
  <div id="titleName">NEON <span class="glow">HARBOR</span></div>

  <div id="titleBtns"><button class="tbtn" id="btnNew">New game</button><button class="tbtn hidden" id="btnContinue">Continue</button></div>
  <div id="titleControls"></div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module" src="./src/main.js"></script>
